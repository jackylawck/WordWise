<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 企業級最嚴格 Content Security Policy (無 unsafe-inline, 禁外部連線) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; frame-ancestors 'none';">
    
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="JZ5UohX-CcP_fQV0_DI9VadkKY4ZoTTkUifL88-fIcY">

    <title>智識計 | WordWise - 香港繁簡轉換器 & 離線字數統計工具 (Private HK Text Counter)</title>
    <meta name="description" content="智識計 (WordWise) 是一款專為香港人打造的免費字數統計與香港繁簡轉換器。100% 本地運算、零資料上傳、支援離線 PWA 操作。">
    <meta name="theme-color" content="#0f172a">

    <!-- 本地靜態樣式與圖示 -->
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="WordWiseicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="WordWiseicon-512.png">
    <link rel="manifest" href="manifest.json">

    <!-- 結構化資料 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "智識計 | WordWise",
      "url": "https://jackylawck.github.io/WordWise/",
      "description": "100% 本地運算、零資料上傳的香港繁簡轉換與字數統計工具。",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "All",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "HKD" }
    }
    </script>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div>
                <h1 id="app-title">智識計 | WordWise</h1>
                <p id="app-subtitle">🛡️ 100% 本地運算 · 零資料上傳 · 離線可用</p>
            </div>
            
            <div class="header-actions">
                <span class="badge" role="status">
                    <span class="badge-dot" aria-hidden="true"></span>
                    <span id="status-badge">本地安全加密模式</span>
                </span>
                <button id="btn-lang" type="button" aria-label="Switch Language">🌐 EN</button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="main-grid">
            <!-- Textarea Area -->
            <div class="editor-col">
                <label for="text-input" class="sr-only">輸入文字區域</label>
                <textarea id="text-input" placeholder="請在此貼上或輸入文字..." aria-label="文字輸入框"></textarea>
                
                <div class="button-group">
                    <button id="btn-to-hk" type="button" class="btn btn-primary">轉香港繁體</button>
                    <button id="btn-to-sim" type="button" class="btn btn-secondary">轉簡體</button>
                    <button id="btn-clean" type="button" class="btn btn-secondary">清理多餘空格/空行</button>
                    <button id="btn-copy" type="button" class="btn btn-secondary">複製文字</button>
                    <button id="btn-clear" type="button" class="btn btn-danger">一鍵清空</button>
                </div>
            </div>

            <!-- Statistics Panel -->
            <div class="stats-col">
                <!-- Text Stats -->
                <section class="card" aria-labelledby="lbl-stats-header">
                    <h2 id="lbl-stats-header">文字統計</h2>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div id="lbl-stat-total" class="stat-label">總字元數</div>
                            <div id="stat-total" class="stat-value text-emerald" aria-live="polite">0</div>
                        </div>
                        <div class="stat-box">
                            <div id="lbl-stat-words" class="stat-label">英文詞/無標點</div>
                            <div id="stat-words-only" class="stat-value" aria-live="polite">0</div>
                        </div>
                    </div>
                    <div class="read-time-row">
                        <span id="lbl-read-time">預估閱讀時間：</span>
                        <span id="stat-read-time">0 秒</span>
                    </div>
                </section>

                <!-- Social Media Limits -->
                <section class="card" aria-labelledby="lbl-social-header">
                    <h2 id="lbl-social-header">社群平台字數限制</h2>
                    
                    <div class="limit-item">
                        <div class="limit-label-row">
                            <span>X / Twitter</span>
                            <span id="x-count">0 / 280</span>
                        </div>
                        <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="280">
                            <div id="x-bar" class="progress-fill bar-sky"></div>
                        </div>
                    </div>

                    <div class="limit-item">
                        <div class="limit-label-row">
                            <span>Threads</span>
                            <span id="threads-count">0 / 500</span>
                        </div>
                        <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="500">
                            <div id="threads-bar" class="progress-fill bar-emerald"></div>
                        </div>
                    </div>

                    <div class="limit-item">
                        <div class="limit-label-row">
                            <span>Instagram</span>
                            <span id="ig-count">0 / 2200</span>
                        </div>
                        <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="2200">
                            <div id="ig-bar" class="progress-fill bar-blue"></div>
                        </div>
                    </div>

                    <div class="limit-item">
                        <div class="limit-label-row">
                            <span>LinkedIn</span>
                            <span id="linkedin-count">0 / 3000</span>
                        </div>
                        <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="3000">
                            <div id="linkedin-bar" class="progress-fill bar-indigo"></div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- 外部安全腳本引用 -->
    <script src="app.js"></script>
</body>
</html>
