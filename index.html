<!-- Social Media Limits Box -->
<section aria-labelledby="lbl-social-header" class="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-3">
    <h2 id="lbl-social-header" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">社群平台字數限制</h2>
    
    <!-- 1. X / Twitter Limit (280) -->
    <div class="space-y-1">
        <div class="flex justify-between text-xs">
            <span class="text-slate-300">X / Twitter</span>
            <span id="x-count" class="text-slate-400">0 / 280</span>
        </div>
        <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="280">
            <div id="x-bar" class="bg-sky-400 h-full w-0 transition-all duration-300"></div>
        </div>
    </div>

    <!-- 2. Threads Limit (500) -->
    <div class="space-y-1 pt-2">
        <div class="flex justify-between text-xs">
            <span class="text-slate-300">Threads</span>
            <span id="threads-count" class="text-slate-400">0 / 500</span>
        </div>
        <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="500">
            <div id="threads-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
        </div>
    </div>

    <!-- 3. Instagram Limit (2200) -->
    <div class="space-y-1 pt-2">
        <div class="flex justify-between text-xs">
            <span class="text-slate-300">Instagram</span>
            <span id="ig-count" class="text-slate-400">0 / 2200</span>
        </div>
        <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="2200">
            <div id="ig-bar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
        </div>
    </div>

    <!-- 4. LinkedIn Limit (3000) -->
    <div class="space-y-1 pt-2">
        <div class="flex justify-between text-xs">
            <span class="text-slate-300">LinkedIn</span>
            <span id="linkedin-count" class="text-slate-400">0 / 3000</span>
        </div>
        <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="3000">
            <div id="linkedin-bar" class="bg-blue-600 h-full w-0 transition-all duration-300"></div>
        </div>
    </div>
</section>
